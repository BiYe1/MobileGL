name: Build Android .so

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ "main" ] # 你推送到 main 分支时自动构建

jobs:
  build:
    runs-on: ubuntu-latest
    env:
        BUILD_ROOT: ${{github.workspace}}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Setup ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          ccache --max-size=500M
          ccache -z

      - name: Update glslang external sources
        working-directory: ${{env.BUILD_ROOT}}/3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
            vulkan-query-version: 1.4.304.1
            vulkan-components: Vulkan-Headers, Vulkan-Loader
            vulkan-use-cache: true

      - name: Configure CMake
        working-directory: ${{env.BUILD_ROOT}}
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_TOOLCHAIN=clang \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF

      - name: Build
        run: cmake --build build --config Release --parallel $(nproc)

      - name: Strip symbols (optional, reduce size)
        run: |
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build/libMobileGL.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-Android-arm64
          path: build/libMobileGL.so