name: Build .so Library

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04          # 关键！ 24.04 自带 GCC 14，完美兼容 C++23

    steps:
      - name: Force HTTPS for submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang python3 libvulkan-dev

      - name: Initialize glslang dependencies
        run: |
          GLSLANG_DIR=$(find . -type d -name "glslang" -not -path "./.git/*" | head -n 1)
          if [ -z "$GLSLANG_DIR" ]; then
            echo "ERROR: Could not find glslang directory."
            exit 1
          fi
          echo "Found glslang at: $GLSLANG_DIR"
          cd "$GLSLANG_DIR"
          python3 update_glslang_sources.py

      - name: Configure CMake
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DMOBILEGL_BUILD_TEST=OFF
          -DMOBILEGL_BUILD_BENCHMARK=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Show built .so files
        run: find build -name "*.so" -exec ls -lh {} \;

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilegl-linux-x64-shared
          path: build/*.so